<text x="64" y="128.73" font-family="Helvetica,Arial,sans-serif" font-size="39" font-weight="700" fill="#172B45">One PPM record: entry to downstream use</text>
<text x="64" y="169.35" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#52647A">Personnel entry belongs to Flutter. The existing CI3 API enforces author, device, template, revision and trace checks.</text>
<text x="64" y="1166.05" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#52647A">Default seed + current CI3 service rules | Editable source included | See accuracy notes</text>
<text x="1570.13" y="1166.05" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#2563A6">03 / 09</text>
<text x="82" y="266.05" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#52647A">PERSONNEL / FLUTTER CLIENT RESPONSIBILITY</text>
<text x="708" y="547.05" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#087E83">Yes</text>
<text x="366" y="547.05" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#087E83">Yes</text>
<text x="918" y="684.05" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#AD4141">No</text>
<text x="568" y="684.05" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#98610A">No</text>
<text x="82" y="695.05" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#087E83">No review prerequisite</text>
<text x="1138" y="736.05" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#52647A">INDEPENDENT GUIDANCE / SUBMITTED REVISION</text>
<text x="98" y="1108.13" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#087E83">Drafts: record ACTIVE / revision DRAFT. Submission and publication are separate. Reviews stay on the exact content revision.</text>
<text x="1135" y="658.2" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647A">Each role may act independently.</text>
<text x="1135" y="679" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#52647A">ADMIN may explicitly name any stage.</text>
