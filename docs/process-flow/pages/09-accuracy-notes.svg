<text x="872" y="961.2" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#172B45">Full SHA-256 values: source/default-ppm-flow.json</text>
<text x="872" y="982" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#172B45">Build and validation commands: README.md</text>
<text x="872" y="1002.8" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#172B45">All shapes, labels and connectors: included .drawio file</text>
<text x="872" y="1052.12" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#087E83">No live database was queried or changed.</text>
<text x="872" y="1072.92" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#087E83">No existing PDF was supplied; this is a new source-based document.</text>
