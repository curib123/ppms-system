<text x="64" y="54.05" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#2563A6">PPMS / PROCESS DOCUMENTATION</text>
<text x="1405.17" y="52.98" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#52647A">27 OCTOBER 2026 / DEFAULTS</text>
<text x="64" y="128.73" font-family="Helvetica,Arial,sans-serif" font-size="39" font-weight="700" fill="#172B45">Corrections and downstream revalidation</text>
<text x="64" y="169.35" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#52647A">A review note and an actual data correction follow different paths. Preserve original evidence and immutable history.</text>
<text x="64" y="1166.05" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#52647A">Default seed + current CI3 service rules | Editable source included | See accuracy notes</text>
<text x="1570.13" y="1166.05" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#2563A6">04 / 09</text>
<text x="610" y="229.05" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#2563A6">No / review only</text>
<text x="548" y="483.05" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#2563A6">Yes</text>
<text x="98" y="689.275" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#087E83">Resubmit the corrected source, then publish fresh eligible outputs. Existing links remain historical; superseded outputs cannot be selected for new work.</text>
<text x="80" y="757.12" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2563A6">DOWNSTREAM IMPACT RESOLUTION / REVIEWER ROLE + FORM ACCESS + CURRENT REVISION</text>
<text x="650" y="795.05" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#087E83">No</text>
<text x="650" y="1035.05" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#98610A">Yes</text>
